name: Unpack the site build

# One-off helper: checks the uploaded build zip, unpacks it into the
# repository root, removes the zip and this workflow, and commits.

on:
  push:
    paths:
      - '.github/workflows/unpack-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check and unpack the zip
        run: |
          echo "e8ea52463edd5a6f84d65ad8b4d0707aaf6ae8d7c636a60fb40d82bcfbad16f8  relofy-pages.zip" | sha256sum -c -
          unzip -o -q relofy-pages.zip
          rm -f relofy-pages.zip
          touch .nojekyll
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/unpack-site.yml
          rm -f .github/workflows/unpack-site.yml
          git add -A
          git commit -q -m "relofy.com site build" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01ESfTZA8H4WC8BYoRpzcGnk"
          if ! git push 2> /tmp/push.log; then
            cat /tmp/push.log
            grep -qi "workflow" /tmp/push.log || exit 1
            git checkout HEAD~1 -- .github/workflows/unpack-site.yml
            git commit -q --amend --no-edit
            git push
          fi
